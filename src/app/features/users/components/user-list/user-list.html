<section class="space-y-6">
  <input
    type="text"
    placeholder="Rechercher un utilisateur (nom ou rôle)..."
    class="w-full rounded-lg border border-gray-300 bg-white px-4 py-2 shadow-sm focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-200 sm:max-w-md"
    [(ngModel)]="searchTerm"
  />

  @if (filteredUsers().length === 0) {
    <app-empty-state message="Aucun utilisateur ne correspond à la recherche." />
  } @else {
    <div class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3">
      @for (user of filteredUsers(); track user.id) {
        <app-user-card [user]="user" [projects]="projects()" />
      }
    </div>
  }
</section>
