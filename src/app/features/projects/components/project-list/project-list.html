<section class="space-y-6">
  <div class="flex flex-col gap-3 sm:flex-row sm:items-center">
    <input
      type="text"
      placeholder="Rechercher un projet..."
      class="w-full rounded-lg border border-gray-300 bg-white px-4 py-2 shadow-sm focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-200 sm:max-w-md"
      [(ngModel)]="searchTerm"
    />
    <button
      type="button"
      class="rounded-lg border border-gray-300 bg-white px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50"
      (click)="sortByName()"
    >
      Trier par nom
    </button>
  </div>

  @if (selectedProject(); as selected) {
    <p class="rounded-lg bg-indigo-50 px-4 py-2 text-sm text-indigo-800">
      Projet sélectionné : <strong>{{ selected.name }}</strong>
    </p>
  }

  @if (filteredProjects().length === 0) {
    <app-empty-state message="Aucun projet ne correspond à la recherche." />
  } @else {
    <div class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3">
      @for (project of filteredProjects(); track project.id) {
        <app-project-card
          [project]="project"
          [selected]="selectedProject()?.id === project.id"
          (projectSelected)="onProjectSelected($event)"
        />
      }
    </div>
  }
</section>
