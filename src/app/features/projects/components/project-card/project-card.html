<article
  class="flex h-full flex-col rounded-xl bg-white p-5 shadow-md transition"
  [class.ring-2]="selected()"
  [class.ring-indigo-500]="selected()"
>
  <header class="mb-3 flex items-start justify-between gap-3">
    <h2 class="text-lg font-semibold text-gray-900">{{ project().name }}</h2>
    <span class="shrink-0 rounded-full px-2.5 py-0.5 text-xs font-semibold" [class]="statusBadge[project().status]">
      {{ project().status }}
    </span>
  </header>

  <p class="mb-4 text-sm text-gray-600">{{ project().description }}</p>

  <h3 class="mb-2 text-xs font-semibold uppercase tracking-wide text-gray-500">
    Tâches ({{ project().tasks.length }})
  </h3>
  <app-task-list [tasks]="project().tasks" />

  <div class="mt-auto pt-4">
    <button
      type="button"
      class="w-full rounded-lg bg-indigo-600 px-4 py-2 text-sm font-medium text-white hover:bg-indigo-700 disabled:bg-indigo-300"
      [disabled]="selected()"
      (click)="selectProject()"
    >
      {{ selected() ? 'Sélectionné' : 'Sélectionner' }}
    </button>
  </div>
</article>
