<div class="inline-flex rounded-lg bg-white p-1 shadow-sm ring-1 ring-gray-200" role="group" aria-label="Mode d’affichage">
  @for (option of options; track option.value) {
    <button
      type="button"
      class="rounded-md px-4 py-1.5 text-sm font-medium transition"
      [class]="view() === option.value ? 'bg-indigo-600 text-white shadow' : 'text-gray-600 hover:bg-gray-100'"
      [attr.aria-pressed]="view() === option.value"
      (click)="select(option.value)"
    >
      {{ option.label }}
    </button>
  }
</div>
